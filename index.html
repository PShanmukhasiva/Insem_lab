
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 15px;
        }

        .auth-container {
            max-width: 400px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        h2 {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            text-align: center;
            overflow-wrap: anywhere;
        }

        .welcome {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(200px, 1fr)
            );
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px #00000012;
        }

        .product-image {
            font-size: 60px;
            margin: 15px;
        }

        .price {
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

<header>
    <h1>ShopEasy</h1>
    <p>Your Online Shopping Store</p>
</header>

<main>

    <!-- Signup and Login Section -->
    <section id="authSection" class="auth-container">

        <h2>Create Account</h2>

        <form id="signupForm">
            <input type="text" id="signupName"
                   placeholder="Full Name" required>

            <input type="email" id="signupEmail"
                   placeholder="Email Address" required>

            <input type="password" id="signupPassword"
                   placeholder="Password (minimum 6 characters)"
                   minlength="6" required>

            <button type="submit">Sign Up</button>
        </form>

        <hr>

        <h2>Login</h2>

        <form id="loginForm">
            <input type="email" id="loginEmail"
                   placeholder="Email Address" required>

            <input type="password" id="loginPassword"
                   placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <p id="message" role="status"></p>

    </section>

    <!-- Product Section: Hidden Until Login -->
    <section id="productSection" hidden>

        <div class="welcome">
            <h2 id="welcomeMessage">Welcome!</h2>
            <button id="logoutBtn">Logout</button>
        </div>

        <h2>Our Products</h2>

        <div id="productList" class="product-grid"></div>

    </section>

</main>

<script>
    // Get HTML elements
    const signupForm = document.getElementById("signupForm");
    const loginForm = document.getElementById("loginForm");
    const authSection = document.getElementById("authSection");
    const productSection = document.getElementById("productSection");
    const productList = document.getElementById("productList");
    const message = document.getElementById("message");

    // Product details
    const products = [
        { name: "Laptop", price: 45000, image: "💻" },
        { name: "Mobile Phone", price: 18000, image: "📱" },
        { name: "Headphones", price: 1500, image: "🎧" },
        { name: "Smart Watch", price: 2500, image: "⌚" },
        { name: "Camera", price: 30000, image: "📷" },
        { name: "Shoes", price: 2000, image: "👟" }
    ];

    // Get registered users from localStorage
    function getUsers() {
        return JSON.parse(localStorage.getItem("users")) || [];
    }

    // User Registration
    signupForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("signupName").value.trim();
        const email = document.getElementById("signupEmail")
            .value.trim().toLowerCase();
        const password = document.getElementById("signupPassword").value;

        const users = getUsers();

        // Check existing email
        if (users.some(user => user.email === email)) {
            message.textContent = "Email already registered!";
            return;
        }

        // Save user details
        users.push({ name, email, password });

        localStorage.setItem("users", JSON.stringify(users));

        message.textContent = "Registration successful! Please login.";
        signupForm.reset();
    });

    // User Login
    loginForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const email = document.getElementById("loginEmail")
            .value.trim().toLowerCase();
        const password = document.getElementById("loginPassword").value;

        const users = getUsers();

        const user = users.find(
            user => user.email === email && user.password === password
        );

        if (user) {
            sessionStorage.setItem("loggedInEmail", user.email);
            message.textContent = "";
            showProducts(user);
        } else {
            message.textContent = "Invalid email or password!";
        }
    });

    // Display products using DOM manipulation
    function showProducts(user) {
        authSection.hidden = true;
        productSection.hidden = false;

        document.getElementById("welcomeMessage").textContent =
            "Welcome, " + user.name + "!";

        productList.replaceChildren();

        products.forEach(function(product) {
            const card = document.createElement("div");
            card.className = "product-card";

            const image = document.createElement("div");
            image.className = "product-image";
            image.textContent = product.image;

            const name = document.createElement("h3");
            name.textContent = product.name;

            const price = document.createElement("p");
            price.className = "price";
            price.textContent =
                "₹" + product.price.toLocaleString("en-IN");

            const button = document.createElement("button");
            button.textContent = "Add to Cart";

            button.addEventListener("click", function() {
                alert(product.name + " added to cart!");
            });

            card.append(image, name, price, button);
            productList.appendChild(card);
        });
    }

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", function() {
        sessionStorage.removeItem("loggedInEmail");

        productSection.hidden = true;
        authSection.hidden = false;

        loginForm.reset();
        message.textContent = "You have logged out successfully.";
    });

    // Restore login during the current tab session
    const loggedInEmail = sessionStorage.getItem("loggedInEmail");

    if (loggedInEmail) {
        const user = getUsers().find(
            user => user.email === loggedInEmail
        );

        if (user) {
            showProducts(user);
        } else {
            sessionStorage.removeItem("loggedInEmail");
        }
    }
</script>

</body>
</html>
